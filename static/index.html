<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo API - Modern Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-background"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4" />
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
          </svg>
        </div>
        <div>
          <h1 class="app-title">Todo Studio</h1>
          <p class="app-subtitle">Powered by FastAPI &amp; Asynchronous REST Endpoints</p>
        </div>
      </div>
      <div class="header-actions">
        <div id="connection-status" class="status-pill connected">
          <span class="status-dot"></span>
          <span class="status-text">API Online</span>
        </div>
        <a href="/docs" target="_blank" class="nav-btn docs-btn" title="Open Swagger Documentation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>Swagger Docs</span>
        </a>
      </div>
    </header>

    <!-- Stats Overview -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-info">
          <span class="stat-label">Total Tasks</span>
          <span class="stat-value" id="stat-total">0</span>
        </div>
        <div class="stat-icon total-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path>
          </svg>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-info">
          <span class="stat-label">Pending</span>
          <span class="stat-value" id="stat-pending">0</span>
        </div>
        <div class="stat-icon pending-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-info">
          <span class="stat-label">Completed</span>
          <span class="stat-value" id="stat-completed">0</span>
        </div>
        <div class="stat-icon completed-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
      </div>
    </section>

    <!-- Main Content Area -->
    <main class="main-card">
      <!-- Create Todo Form -->
      <form id="todo-form" class="todo-form">
        <div class="form-input-group">
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <input
              type="text"
              id="todo-input"
              placeholder="What needs to be done? e.g. Build FastAPI CRUD endpoints"
              autocomplete="off"
              required
            />
          </div>
          <button type="submit" class="submit-btn" id="add-btn">
            <span>Add Task</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
      </form>

      <!-- Search & Filters -->
      <div class="controls-bar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="Search tasks..." />
          <button type="button" id="clear-search-btn" class="clear-btn" title="Clear search" style="display: none;">&times;</button>
        </div>

        <div class="filter-pills">
          <button type="button" class="filter-pill active" data-filter="all">All</button>
          <button type="button" class="filter-pill" data-filter="active">Pending</button>
          <button type="button" class="filter-pill" data-filter="completed">Completed</button>
        </div>
      </div>

      <!-- Todo List -->
      <div class="todo-list-wrapper">
        <div id="loading-spinner" class="loading-state" style="display: none;">
          <div class="spinner"></div>
          <p>Syncing with FastAPI server...</p>
        </div>

        <ul id="todo-list" class="todo-list"></ul>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state" style="display: none;">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </div>
          <h3 id="empty-title">No tasks found</h3>
          <p id="empty-desc">Get started by creating your first task above.</p>
        </div>
      </div>

      <!-- Footer Info -->
      <div class="card-footer">
        <div class="progress-container">
          <div class="progress-bar-bg">
            <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%"></div>
          </div>
          <span id="progress-text" class="progress-text">0% completed</span>
        </div>
        <div class="footer-links">
          <button id="refresh-btn" class="icon-btn-text" title="Reload todos from server">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <span>Sync</span>
          </button>
        </div>
      </div>
    </main>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal-backdrop" style="display: none;">
      <div class="modal-dialog">
        <div class="modal-header">
          <h3>Edit Task</h3>
          <button type="button" class="modal-close" id="modal-close-btn">&times;</button>
        </div>
        <form id="edit-form" class="modal-body">
          <input type="hidden" id="edit-todo-id" />
          <div class="input-field">
            <label for="edit-todo-title">Task Title</label>
            <input type="text" id="edit-todo-title" required autocomplete="off" />
          </div>
          <div class="checkbox-field">
            <label class="custom-checkbox-container">
              <input type="checkbox" id="edit-todo-completed" />
              <span class="checkmark"></span>
              <span class="checkbox-label">Mark as completed</span>
            </label>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="modal-cancel-btn">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
